apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprofile-app
  namespace: vprofile
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vprofile-app
  template:
    metadata:
      labels:
        app: vprofile-app
    spec:
      securityContext:
        runAsNonRoot: true    #k8s will refuse to start it if it tries to become root
        runAsUser: 10001        #start directly as  user(UID:10001)
        runAsGroup: 10001       #in group of that user 10001
        fsGroup: 10001          # k8s will automatically chown 
        seccompProfile: {type: RuntimeDefault}   #Block dangerous system calls, safe default

      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 3 devopsdb 3306; do echo waiting for devopsdb; sleep; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 12m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: app
          image: karkamprashanth/project1:app
          ports:
            - containerPort: 8080
          env:
            - name: JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: vprofile-config
                  key: JDBC_URL
            - name: JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vprofile-db
                  key: JDBC_USERNAME
            - name: JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vprofile-db
                  key: JDBC_PASSWORD
          resources:
            requests:
              cpu: "200m"
              memory: "400Mi"
            limits:
              cpu: "400m"
              memory: "800Mi"
          startupProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}

