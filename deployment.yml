apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprofile-app
  namespace: vprofile
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vprofile-app
  template:
    metadata:
      labels:
        app: vprofile-app
    spec:
      containers:
        - name: app
          image: karkamprashanth/project1:app
          ports:
            - containerPort: 8080
          env:
            - name: JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: vprofile-config
                  key: JDBC_URL
            - name: JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vprofile-db
                  key: JDBC_USERNAME
            - name: JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vprofile-db
                  key: JDBC_PASSWORD
          resources:
            requests:
              cpu: "200m"
              memory: "400Mi"
            limits:
              cpu: "400m"
              memory: "800Mi"
